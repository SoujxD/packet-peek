x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: packetpeek
      POSTGRES_USER: packetpeek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetpeek -d packetpeek"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      observability: "true"
    logging: *default-logging

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=packetpeek;Username=packetpeek;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY to at least 32 bytes}
      Operator__Username: ${OPERATOR_USERNAME:-operator}
      Operator__Password: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD to a strong password}
      Database__Migrate: "true"
      Engine__Enabled: ${ENGINE_ENABLED:-false}
      Engine__Path: /usr/local/bin/libpeek
      Engine__Pcap: ${ENGINE_PCAP-/app/fixtures/http.pcap}
      Engine__Interface: ${ENGINE_INTERFACE:-}
      Engine__Filter: ${ENGINE_FILTER:-ip or ip6}
      Console__ApiBaseUrl: http://127.0.0.1:8080/
    labels:
      observability: "true"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    labels:
      observability: "true"
    logging: *default-logging

  loki:
    image: packetpeek-loki:3.7.0
    build:
      context: ./monitoring
      dockerfile: loki/Dockerfile
    command: -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  alloy:
    image: packetpeek-alloy:v1.21.3
    build:
      context: ./monitoring
      dockerfile: alloy/Dockerfile
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:12345/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD to a strong password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    labels:
      observability: "true"
    logging: *default-logging

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
