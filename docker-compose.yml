services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: packetpeek
      POSTGRES_USER: packetpeek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
